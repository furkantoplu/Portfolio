# Temporary network fixture only, NOT the site's production configuration.
# Port 443 intentionally uses plaintext HTTP solely to test TCP forwarding.
services:
  probe:
    image: nginx:alpine
    restart: "no"
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 100
    ports:
      - "80:80"
      - "443:80"
      - "8080:80"
      - "127.0.0.1:8055:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 3s
      timeout: 2s
      retries: 5
