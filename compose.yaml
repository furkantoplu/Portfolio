services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fizyoterapi}
      POSTGRES_USER: ${POSTGRES_USER:-directus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  directus:
    image: directus/directus:12.4.0
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DIRECTUS_PORT:-8055}:8055"
    environment:
      SECRET: ${DIRECTUS_SECRET:?DIRECTUS_SECRET must be set}
      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB:-fizyoterapi}
      DB_USER: ${POSTGRES_USER:-directus}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:-admin@furkantoplu.com}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:?DIRECTUS_ADMIN_PASSWORD must be set}
      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL:-http://localhost:8055}
      PROJECT_OWNER_ENABLED: ${DIRECTUS_PROJECT_OWNER_ENABLED:-false}
      SESSION_COOKIE_TTL: ${DIRECTUS_SESSION_COOKIE_TTL:-1d}
      SESSION_COOKIE_SECURE: ${DIRECTUS_SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SAME_SITE: lax
      LOGIN_STALL_TIME: "750"
      TELEMETRY: "false"
      FILES_MAX_UPLOAD_SIZE: "10mb"
      WEBSOCKETS_ENABLED: "true"
    volumes:
      - directus_uploads:/directus/uploads
      - ./directus/extensions:/directus/extensions:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8055/admin/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s

  content-migrations:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      database:
        condition: service_healthy
      directus:
        condition: service_healthy
    environment:
      PGHOST: database
      PGDATABASE: ${POSTGRES_DB:-fizyoterapi}
      PGUSER: ${POSTGRES_USER:-directus}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - ./scripts/migrations:/migrations:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/migrations/001-content-translations.sql", "-f", "/migrations/002-page-language-seeds.sql", "-f", "/migrations/003-editable-public-pages.sql", "-f", "/migrations/004-practice-title-urls.sql", "-f", "/migrations/005-password-policy-escaping.sql", "-f", "/migrations/006-section-visibility.sql", "-f", "/migrations/007-white-coat-hero.sql", "-f", "/migrations/008-media-cleanup.sql", "-f", "/migrations/009-footer-settings.sql", "-f", "/migrations/010-owner-portrait-defaults.sql", "-f", "/migrations/011-content-delete-cleanup.sql"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        SITE_PUBLIC_URL: ${SITE_PUBLIC_URL:-http://localhost:8080}
    image: fizyoterapist-frontend:local
    restart: unless-stopped
    depends_on:
      directus:
        condition: service_healthy
      content-migrations:
        condition: service_completed_successfully
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_WRITE_LOGS: "false"
      DIRECTUS_URL: http://directus:8055
      SITE_PUBLIC_URL: ${SITE_PUBLIC_URL:-http://localhost:8080}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  postgres_data:
  directus_uploads:
